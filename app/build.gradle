plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stellorbis.ringultra2026'
    compileSdk 34

    defaultConfig {
        applicationId "com.stellorbis.ringultra2026"
        minSdk 23
        targetSdk 34
        versionCode 261001
        versionName "26.10.01"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 本工程零外部依赖（纯 android.* API），无需 dependencies 块
